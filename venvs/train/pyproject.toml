[project]
name = "echi-train"
version = "0.1.0"
description = "Baselines for the ECHI task of the CHiME-9 challenge"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "hydra-core>=1.3.2",
    "librosa",
    "matplotlib>=3.10.5",
    "numpy",
    "pip>=25.1.1",
    "pre-commit>=4.2.0",
    "pympler>=1.1",
    "resemblyzer>=0.1.4",
    "setuptools",
    "slab>=1.8.2",
    "soundfile==0.12.1",
    "soxr>=0.5.0.post1",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "torch-complex>=0.4.4",
    "torch-stoi>=0.2.3",
    "torchinfo>=1.8.0",
    "tqdm>=4.67.1",
    "wandb>=0.21.1,<0.23.0",
    "julius>=0.2.7",
    "pandas>=2.3.3",
    "hydra-submitit-launcher>=1.2.0",
    "opencv-python>=4.11.0.86",
    "pyroomacoustics>=0.9.0",
    "mpi4py>=4.1.1",
    "silero-vad>=6.2.0",
    "ci-sdr>=0.0.2",
    "espnet-model-zoo>=0.1.7",
    "espnet[spk]==202506",
    "scipy==1.16.0",
    "onnxruntime==1.16.1",
    "pyarrow<21.0.0",
    "robauraloss",
]

[tool.uv.pip]
only-binary = ["pandas", ":all:"]
#no-binary = []

[tool.uv.sources]
espnet = { git = "https://github.com/espnet/espnet" }
robauraloss = { git = "https://github.com/MxRobsta/RobAuraLoss.git" }
